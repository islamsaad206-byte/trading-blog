<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اتصل بنا - مدونة أسرار التداول</title>
    <style>
        :root { --bg-body: #0b0f19; --bg-card: #151c2c; --primary: #38bdf8; --secondary: #a855f7; --text-main: #f8fafc; --text-sub: #94a3b8; }
        body { background-color: var(--bg-body); color: var(--text-main); line-height: 1.7; padding: 2rem 1rem; font-family: system-ui, sans-serif; }
        .container { max-width: 800px; margin: 0 auto; background: var(--bg-card); padding: 2rem; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); }
        h1 { color: var(--primary); margin-bottom: 1rem; }
        p { color: var(--text-sub); margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        input, textarea { width: 100%; padding: 0.8rem; background: #0b0f19; border: 1px solid #1e293b; color: #fff; border-radius: 6px; margin-top: 0.3rem; }
        .btn { background: linear-gradient(90deg, var(--primary), #0284c7); color: white; padding: 0.6rem 1.5rem; border-radius: 6px; border: none; cursor: pointer; font-weight: bold; }
        a { color: var(--primary); text-decoration: none; display: inline-block; margin-top: 1.5rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>اتصل بنا</h1>
        <p>يسعدنا تواصلك معنا لأي استفسارات أو اقتراحات أو طلبات الإعلانات.</p>
        <div class="form-group">
            <label style="color:var(--text-main);">الاسم الكريم:</label>
            <input type="text" placeholder="اكتب اسمك هنا...">
        </div>
        <div class="form-group">
            <label style="color:var(--text-main);">البريد الإلكتروني:</label>
            <input type="email" placeholder="example@domain.com">
        </div>
        <div class="form-group">
            <label style="color:var(--text-main);">الرسالة:</label>
            <textarea rows="4" placeholder="اكتب رسالتك هنا..."></textarea>
        </div>
        <button class="btn" onclick="alert('تم ارسال رسالتك بنجاح!')">إرسال الرسالة</button>
        <br>
        <a href="index.html">&larr; العودة إلى الصفحة الرئيسية</a>
    </div>
</body>
</html>
